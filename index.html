<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1a24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Kitesurf</title>
    <style>
      /* Spec §5.4. touch-action does not inherit, so the canvas needs its own;
         the rest is set on the root so nothing in the page can scroll or
         select behind a thumb that misses. */
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1a24;
        color: #cfe6f2;
        font: 16px/1.5 system-ui, sans-serif;
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      /* The rotate prompt (spec §5.4).
         screen.orientation.lock() is gated behind fullscreen everywhere that
         implements it and absent on iOS, so the lock is best-effort and this is
         the fallback that actually carries the case. In CSS rather than JS so
         it is up before the bundle has parsed, and gated on a coarse pointer so
         a narrow desktop window is never told to rotate a monitor. */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem;
        text-align: center;
        background: #0b1a24;
      }

      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }

      #rotate svg {
        width: 72px;
        height: 72px;
        animation: tip 2.4s ease-in-out infinite;
      }

      @keyframes tip {
        0%, 40% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        #rotate svg { animation: none; transform: rotate(-90deg); }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="rotate" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="#cfe6f2" stroke-width="1.5" aria-hidden="true">
        <rect x="7" y="2" width="10" height="20" rx="2" />
        <path d="M10.5 19h3" stroke-linecap="round" />
      </svg>
      <p>Turn your device sideways to ride.</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
