services:
  kitesurf-game:
    build:
      context: .
      dockerfile: Dockerfile
    image: kitesurf-game:latest
    container_name: kitesurf-game
    restart: unless-stopped
    environment:
      - PORT=3000
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.kitesurf-game.rule: "Host(`kitesurf-game.${DOMAIN}`)"
      traefik.http.routers.kitesurf-game.entrypoints: "web"
      traefik.http.routers.kitesurf-game.middlewares: "security-headers@file"
      traefik.http.services.kitesurf-game.loadbalancer.server.port: 3000

networks:
  proxy:
    external: true
